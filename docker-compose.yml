version: "3.8"

services:
  drec-postgres:
    image: postgres:latest
    container_name: drec-postgres
    environment:
      POSTGRES_DB: origin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data

  drec-redis:
    image: redis:latest
    container_name: drec-redis
    ports:
      - 6379:6379

  drec-influxdb:
    image: influxdb:1.8
    container_name: drec-influxdb
    environment:
      INFLUXDB_DB: energy
      INFLUXDB_ADMIN_USER: test
      INFLUXDB_ADMIN_PASSWORD: test
      INFLUXDB_USER: api
      INFLUXDB_USER_PASSWORD: secret
    ports:
      - 8086:8086
    volumes:
      - influxdb-data:/var/lib/influxdb
      - ./influxdb.conf:/etc/influxdb/influxdb.conf

  drec-origin-backend:
    container_name: drec-origin-backend
    build: projects/drec-origin # Adjust path to backend Dockerfile
    ports:
      - "3040:3040" # Map backend port
    environment:
      DB_HOST: drec-postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: origin
    depends_on:
      - drec-postgres
      - drec-redis
      - drec-influxdb

volumes:
  postgres-data:
  influxdb-data:
