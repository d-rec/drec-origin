version: "3.8"

services:
  drec-postgres:
    image: postgres:14.17
    container_name: drec-postgres
    environment:
      POSTGRES_DB: origin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data

  drec-redis:
    image: redis:6.2
    container_name: drec-redis
    ports:
      - 6379:6379

  drec-influxdb:
    image: influxdb:1.8
    container_name: drec-influxdb
    environment:
      INFLUXDB_DB: energy
      INFLUXDB_ADMIN_USER: test
      INFLUXDB_ADMIN_PASSWORD: test
      INFLUXDB_USER: api
      INFLUXDB_USER_PASSWORD: secret
    ports:
      - 8086:8086
    volumes:
      - influxdb-data:/var/lib/influxdb
      - ./influxdb.conf:/etc/influxdb/influxdb.conf

  drec-minio:
    image: minio/minio:latest
    container_name: drec-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  drec-mailpit:
    image: axllent/mailpit:latest
    container_name: drec-mailpit
    ports:
      - 1025:1025   # SMTP
      - 8025:8025   # Web inbox UI

  drec-minio-init:
    image: minio/mc:latest
    container_name: drec-minio-init
    depends_on:
      drec-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://drec-minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/drec-documents &&
      mc anonymous set public local/drec-documents
      "

volumes:
  postgres-data:
  influxdb-data:
  minio-data:
