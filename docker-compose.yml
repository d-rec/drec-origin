services:
  drec-postgres:
    image: postgres:14.17
    container_name: drec-postgres
    environment:
      POSTGRES_DB: origin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data

  drec-redis:
    image: redis:6.2
    container_name: drec-redis
    ports:
      - 6379:6379

  # S3-compatible object store for device submission documents.
  #
  # This was MinIO until 2026-10-12. MinIO Inc. withdrew the free community
  # distribution: the Docker Hub images were deleted on 2026-09-11, the
  # dl.min.io binaries return 410 Gone, quay.io closed anonymous pulls on
  # 2026-09-24 and the OSS repo is archived. There is no registry left to
  # point at, so the fixture was replaced rather than repinned.
  #
  # SeaweedFS native S3 port is 8333; it is published on 9000 so
  # AWS_S3_ENDPOINT and every .env stay unchanged. 9001 serves the filer's
  # file browser (what the MinIO console used to be, minus the login).
  drec-seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: drec-seaweedfs
    command: >
      server -dir=/data -s3 -s3.port=8333
      -s3.config=/etc/seaweedfs/s3-config.json
    ports:
      - 9000:8333   # S3 API (used by the backend)
      - 9001:8888   # Filer file browser
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs-s3-config.json:/etc/seaweedfs/s3-config.json:ro
    healthcheck:
      # /healthz, not /: the S3 root returns 403 because -s3.config
      # enforces credentials, and wget treats that as a failure.
      # 127.0.0.1, not localhost: inside the container localhost resolves
      # to ::1, which SeaweedFS does not bind.
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1:8333/healthz']
      interval: 5s
      timeout: 5s
      retries: 10

  drec-mailpit:
    image: axllent/mailpit:latest
    container_name: drec-mailpit
    ports:
      - 1025:1025   # SMTP
      - 8025:8025   # Web inbox UI

  # Creates the bucket on first boot. Uses the AWS CLI rather than MinIO's
  # `mc`, which went away with MinIO itself. No bucket policy is applied:
  # every read in the API is a presigned SigV4 URL (FileService.getSignedUrl),
  # so the old `mc anonymous set public` was never needed -- and an anonymous
  # public bucket is precisely the thing that lets an unsigned-access bug
  # pass locally and fail in production.
  drec-s3-init:
    image: amazon/aws-cli:2.32.3
    container_name: drec-s3-init
    depends_on:
      drec-seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://drec-seaweedfs:8333 s3 mb s3://drec-documents
      || true
      "

  drec-loki:
    image: grafana/loki:3.4.2
    container_name: drec-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - 3100:3100
    volumes:
      - loki-data:/loki

  drec-grafana:
    image: grafana/grafana:11.6.0
    container_name: drec-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - 3001:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/loki.yml
    depends_on:
      - drec-loki

volumes:
  postgres-data:
  seaweedfs-data:
  # Kept declared on purpose. It holds the documents uploaded before the
  # 2026-10-12 MinIO -> SeaweedFS switch; they were copied across, but the
  # originals are left in place rather than silently discarded. Safe to
  # `docker volume rm drec-origin_minio-data` once you are satisfied.
  minio-data:
  loki-data:
  grafana-data:
