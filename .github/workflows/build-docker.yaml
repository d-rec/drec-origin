name: Docker Build

on:
  push:
    branches:
      - develop  # Trigger on pushes to the develop branch
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2  # Checks out the code

      - name: Build Docker image redis
        run: docker build -t redis -f apps/drec-api/Dockerfile apps/drec-api
      
      - name: Build Docker image postgres
        run: docker build -t postgres -f apps/drec-api/Dockerfile apps/drec-api

      - name: Build Docker image influxdb
        run: docker build -t influxdb -f apps/drec-api/Dockerfile apps/drec-api
      
      # List all Docker images built in this job
      - name: List all Docker images
        run: docker images


