name: Docker Build, Push to ECR, and Deploy to Kubernetes

on:
  push:
    branches:
      - ft/move-deployment-to-gh-actions
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        with:
          mask-password: true
          registry-type: private

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: 895706603967.dkr.ecr.eu-west-1.amazonaws.com
          ECR_REPOSITORY: drec-api
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build the Docker image
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f apps/drec-api/Dockerfile apps/drec-api
          
          # Push the image to ECR
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Configure AWS credentials for Kubernetes
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up kubectl
        run: |
          aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name drec

      - name: Deploy to Kubernetes
        env:
          ECR_REGISTRY: 895706603967.dkr.ecr.eu-west-1.amazonaws.com
          ECR_REPOSITORY: drec-api
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl -n dev set image deployment/drec-api drec-api=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG